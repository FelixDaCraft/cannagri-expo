name: Deploy to Hetzner

on:
  push:
    branches:
      - Prod
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: felixdacraft/cannagri-expo

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: set-tag
        run: |
          if [[ "${{ github.ref_name }}" == "Prod" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ github.ref_name == 'Prod' && 'https://cannagri-expo.eu' || 'https://dev.cannagri-expo.eu' }}
            NEXT_PUBLIC_SITE_URL=${{ github.ref_name == 'Prod' && 'https://cannagri-expo.eu' || 'https://dev.cannagri-expo.eu' }}
            NEXT_PUBLIC_TICKETING_ENABLED=${{ github.ref_name == 'Prod' && 'false' || 'true' }}
            NEXT_PUBLIC_DEMO_MODE=${{ github.ref_name == 'Prod' && 'false' || 'true' }}

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/cannagri-expo

            # Login to GitHub Container Registry
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Determine which image to pull based on branch
            if [[ "${{ github.ref_name }}" == "Prod" ]]; then
              IMAGE_TAG="latest"
              CONTAINER="cannagri-app"
            else
              IMAGE_TAG="dev"
              CONTAINER="cannagri-app-dev"
            fi

            # Pull the image
            docker pull ghcr.io/felixdacraft/cannagri-expo:${IMAGE_TAG}

            # Restart only the relevant container (keep the other one running)
            docker compose up -d --no-deps ${CONTAINER}

            # Clean up old images
            docker image prune -f

            # Show status
            docker compose ps
