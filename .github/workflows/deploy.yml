name: Deploy to homelab

# Prod tourne sur le homelab (/opt/cannagri-expo, image construite sur place).
# - push sur Prod : tests puis déploiement par le runner auto-hébergé du homelab
# - push sur dev / pull request : tests uniquement (pas d'environnement de dev)
on:
  push:
    branches:
      - Prod
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: cannagri-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Informatif : ne bloque pas le déploiement
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (production only)
        run: npm audit --omit=dev --audit-level=critical || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to homelab
    needs: test
    if: github.ref == 'refs/heads/Prod' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, homelab]
    # Un seul déploiement à la fois, jamais annulé en cours de route
    concurrency:
      group: deploy-cannagri-prod
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        # Sauvegarde de la base, build (tests inclus), contrôle du schéma,
        # bascule et retour automatique à l'image précédente en cas d'échec.
        # Script : scripts/homelab/cannagri-deploy.sh, installé en root.
        run: sudo /usr/local/bin/cannagri-deploy "$GITHUB_WORKSPACE"

      - name: Check public site
        run: |
          for path in / /api/health /programme; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://cannagri-expo.eu$path")
            echo "$path $code"
            [ "$code" = "200" ] || { echo "::error::$path répond $code"; exit 1; }
          done
