# =============================================================================
# Docker Compose for Hetzner - Production + Development
# Includes Traefik for automatic SSL certificates via Let's Encrypt
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Traefik - Reverse Proxy with automatic SSL
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: always
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=yann.maillot@platinumcbdcup.eu"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - cannagri-network

  # ---------------------------------------------------------------------------
  # Production - cannagri-expo.eu
  # ---------------------------------------------------------------------------
  app:
    image: ghcr.io/felixdacraft/cannagri-expo:latest
    container_name: cannagri-app
    restart: always
    env_file:
      - .env
    volumes:
      - /opt/cannagri-expo/images/gallery:/app/public/images/gallery:ro
    networks:
      - cannagri-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`cannagri-expo.eu`) || Host(`www.cannagri-expo.eu`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"

  # ---------------------------------------------------------------------------
  # Development - dev.cannagri-expo.eu
  # ---------------------------------------------------------------------------
  app-dev:
    image: ghcr.io/felixdacraft/cannagri-expo:dev
    container_name: cannagri-app-dev
    restart: always
    env_file:
      - .env.dev
    volumes:
      - /opt/cannagri-expo/images/gallery:/app/public/images/gallery:ro
    networks:
      - cannagri-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-dev.rule=Host(`dev.cannagri-expo.eu`)"
      - "traefik.http.routers.app-dev.entrypoints=websecure"
      - "traefik.http.routers.app-dev.tls.certresolver=letsencrypt"
      - "traefik.http.services.app-dev.loadbalancer.server.port=3000"

volumes:
  letsencrypt:

networks:
  cannagri-network:
    driver: bridge
