services:
  db:
    image: postgres:15-alpine
    container_name: cannagri-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cannagri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cannagri-app
    restart: always
    ports:
      - "${APP_PORT}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - VIVA_WALLET_CLIENT_ID=${VIVA_WALLET_CLIENT_ID}
      - VIVA_WALLET_CLIENT_SECRET=${VIVA_WALLET_CLIENT_SECRET}
      - VIVA_WALLET_MERCHANT_ID=${VIVA_WALLET_MERCHANT_ID}
      - VIVA_WALLET_API_KEY=${VIVA_WALLET_API_KEY}
      - VIVA_WALLET_SOURCE_CODE=${VIVA_WALLET_SOURCE_CODE}
      - VIVA_WALLET_DEMO_MODE=${VIVA_WALLET_DEMO_MODE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cannagri-network

volumes:
  postgres_data:

networks:
  cannagri-network:
    driver: bridge
